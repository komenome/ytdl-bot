# ytdl-bot configuration
# Copy to config.toml for local development, or let install.sh create
# /etc/ytdl-bot/config.toml on a server.

bot_token = "123456789:REPLACE_WITH_YOUR_BOT_TOKEN"

# Optional seed admins. Leave empty to let the first /start user become admin.
admin_ids = []
# Additional users allowed to use the bot (admins are always allowed).
allowed_users = []

# Maximum number of simultaneous download jobs (1 is safest on a small VPS).
max_concurrent_downloads = 2

# Telegram Bot API upload limit is 50 MB unless you run a local Bot API server.
max_upload_mb = 50

# Highest video height offered. 1080p is the highest H.264 quality on YouTube.
max_video_height = 1080

# Reject videos longer than this (seconds). 7200 = 2 hours.
max_duration_secs = 7200

# Timeouts in seconds.
download_timeout_secs = 1800
info_timeout_secs = 60

# Runtime data (temp downloads, access state, active job counter).
data_dir = "/var/lib/ytdl-bot"

# Optional Netscape cookies file for YouTube bot-check / age-restricted videos.
cookies_file = ""

# Optional explicit tool paths. Leave empty to auto-detect:
#   <exe dir>/bin/yt-dlp, <exe dir>/bin/ffmpeg, <exe dir>/bin/ffprobe
#   ./yt-dlp, ./ffmpeg, ./ffprobe (local development)
#   /usr/bin/yt-dlp, /usr/bin/ffmpeg, /usr/bin/ffprobe
# ytdlp_path = "/opt/ytdl-bot/bin/yt-dlp"
# ffmpeg_path = "/opt/ytdl-bot/bin/ffmpeg"
# ffprobe_path = "/opt/ytdl-bot/bin/ffprobe"
